# Serves the built SPA inside the frontend container. `try_files ...
# /index.html` is the SPA fallback -- without it, a hard refresh on a
# client-side route (e.g. /trades/<uuid>) 404s, since nginx would
# otherwise look for a real file/directory at that exact path.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }
}
