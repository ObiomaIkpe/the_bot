# Logging/audit review, part 2: nothing here previously configured a
# max size/file count for Docker's default json-file log driver, so
# every service's stdout/stderr grew unbounded on the VPS's disk
# indefinitely. One shared policy (10MB x 5 files = 50MB cap per
# service), applied to every service below via this anchor -- tune in
# one place, not four. Applying this to an already-running service
# requires `docker compose up -d` to recreate its container (Docker's
# logging driver is set at container-creation time, not hot-reloadable)
# -- a few seconds of restart per service, not a config-only change.
# `db`'s restart has the largest blast radius (api/shadow_runner both
# depend on it) -- schedule that one deliberately, same as any other
# live-trading-adjacent restart this project does.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trading_bot
      POSTGRES_USER: bot_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot_user"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *default-logging
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8003:8000"
    env_file: ./.env
    # Monitoring/alerting (logging/audit review part 3): api and
    # shadow_runner each need their OWN healthchecks.io check, so
    # HEALTHCHECKS_PING_URL is set per-service here rather than shared
    # via .env. Uncomment once a real check exists for this service --
    # dormant (no real network calls) until then. TELEGRAM_BOT_TOKEN/
    # TELEGRAM_CHAT_ID are shared across services, set once in .env.
    # environment:
    #   HEALTHCHECKS_PING_URL: https://hc-ping.com/<api's-check-uuid>
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
  shadow_runner:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m shadow_runner.main
    env_file: ./.env
    environment:
      BRIDGE_URL: http://38.247.137.208:8001
      SHADOW_RUNNER_USER_ID: d4469ab9-742c-4656-8959-c21602dc71c5
      # Same monitoring note as api's block above -- uncomment once a
      # real check exists for THIS service (a different URL than api's).
      # HEALTHCHECKS_PING_URL: https://hc-ping.com/<shadow_runner's-check-uuid>
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
  frontend:
    # First-ever deploy of the React frontend (2026-09-02) -- previously
    # had no Dockerfile/compose service at all. `frontend/.env` must
    # exist on the host BEFORE this builds (VITE_API_BASE_URL is baked
    # in at build time, not read at container-runtime). Host nginx
    # reverse-proxies thebot.ihusale.com.ng to this container's port
    # 8005 -- see DEPLOY_PLAN.md for the nginx block + Certbot steps,
    # not part of this repo (same VPS-only treatment as the API's own
    # nginx config).
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8005:80"
    restart: unless-stopped
    logging: *default-logging
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    command: caddy run --config /etc/caddyfile --adapter caddyfile
    logging: *default-logging

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
