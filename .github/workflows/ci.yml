name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trading_bot
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # CI-only values -- not used against any real database or secret.
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/trading_bot
      JWT_SECRET_KEY: ci-only-test-secret-not-for-real-use
      CREDENTIALS_ENCRYPTION_KEY: OLm5iHb7HxxVy2RtX8DOi6WUFwuJSv8yxElVayOcNy8=

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt -r requirements-dev.txt

      - run: pytest
